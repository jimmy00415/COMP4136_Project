# Fixed public backend; clients cannot choose another upstream.
proxy_pass https://hk-movie-rag-demo-4l6lw3rnaa-uc.a.run.app;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_set_header Host hk-movie-rag-demo-4l6lw3rnaa-uc.a.run.app;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_ssl_name hk-movie-rag-demo-4l6lw3rnaa-uc.a.run.app;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 15s;
proxy_send_timeout 310s;
proxy_read_timeout 310s;
proxy_intercept_errors off;
proxy_next_upstream off;
proxy_cache off;
proxy_redirect off;
