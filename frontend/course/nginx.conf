worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    client_max_body_size 512k;
    client_body_timeout 30s;
    send_timeout 310s;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }
        location = /static/app.js { try_files $uri =404; }
        location = /static/styles.css { try_files $uri =404; }

        # Readiness exercises the same live backend as the browser.
        location = /health {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/backend-proxy.conf;
        }
        location = /api/config {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/backend-proxy.conf;
        }
        location = /api/chat {
            if ($request_method != POST) { return 405; }
            include /etc/nginx/backend-proxy.conf;
        }
        location ~ ^/api/posters/[A-Za-z0-9_-]+$ {
            if ($request_method != GET) { return 405; }
            include /etc/nginx/backend-proxy.conf;
        }
        location / { return 404; }
    }
}
